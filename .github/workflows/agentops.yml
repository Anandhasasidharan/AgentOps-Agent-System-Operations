name: AgentOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_REPOSITORY: asd492/agentops
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test all services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - path: agentops-core
            module: agentops_core
          - path: agentops-events
            module: agentops_events
          - path: agent-circuit-breaker
            module: circuit_breaker
          - path: agent-chaos-toolkit
            module: chaos_toolkit
          - path: agent-slo-platform
            module: agent_slo
          - path: dashboard
            module: dashboard
          - path: agent-gateway
            module: gateway
          - path: agentops-sdk
            module: agentops
          - path: agentops-langchain
            module: agentops_langchain
          - path: agentops-engine
            module: agentops_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        if: matrix.service.path == 'dashboard'
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -e agentops-core/
          pip install -e agentops-events/
          pip install -e ${{ matrix.service.path }}/
          pip install -e ${{ matrix.service.path }}/"[dev]"

      - name: Install circuit breaker for engine tests
        if: matrix.service.path == 'agentops-engine'
        run: pip install -e agent-circuit-breaker/

      - name: Run tests
        run: |
          cd ${{ matrix.service.path }}
          python -m pytest -x --cov=${{ matrix.service.module }} --cov-report=term-missing

  clean-install:
    name: Clean venv install and full test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install and test in a brand-new virtualenv
        run: |
          python -m venv /tmp/agentops-clean
          . /tmp/agentops-clean/bin/activate
          python -m pip install --upgrade pip
          pip install -e agentops-core/ -e agentops-events/
          pip install -e agent-circuit-breaker/"[dev]" \
                      -e agent-chaos-toolkit/"[dev]" \
                      -e agent-slo-platform/"[dev]" \
                      -e dashboard/"[dev]" \
                      -e agent-gateway/"[dev]" \
                      -e agentops-sdk/"[dev]" \
                      -e agentops-langchain/"[dev]" \
                      -e agentops-engine/"[dev]"
          for pkg in agentops-core agentops-events agent-circuit-breaker \
                     agent-chaos-toolkit agent-slo-platform dashboard \
                     agent-gateway agentops-sdk agentops-langchain agentops-engine; do
            echo "=== $pkg ==="
            (cd "$pkg" && python -m pytest -x)
          done

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all services
        run: |
          pip install -e agentops-core/
          pip install -e agentops-events/
          pip install -e agent-circuit-breaker/"[dev]"
          pip install -e agent-chaos-toolkit/"[dev]"
          pip install -e agent-slo-platform/"[dev]"
          pip install -e dashboard/"[dev]"
          pip install -e agent-gateway/"[dev]"
          pip install -e agentops-sdk/"[dev]"
          pip install -e agentops-langchain/"[dev]"
          pip install -e agentops-engine/"[dev]"
          pip install ruff==0.16.10 black==26.10.0

      - name: Ruff
        run: |
          ruff check agentops-core/src agentops-events/src agent-gateway/src \
            agent-circuit-breaker/src agent-chaos-toolkit/src agent-slo-platform/src \
            dashboard/src agentops-sdk/src agentops-langchain/src agentops-engine/src

      - name: Black check
        run: |
          black --check agentops-core/src agentops-events/src agent-gateway/src \
            agent-circuit-breaker/src agent-chaos-toolkit/src agent-slo-platform/src \
            dashboard/src agentops-sdk/src agentops-langchain/src agentops-engine/src

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, lint, clean-install, durable-events]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push images
        run: |
          for service in agent-circuit-breaker agent-chaos-toolkit agent-slo-platform dashboard agent-gateway; do
            docker build \
              --build-arg SERVICE=$service \
              -t ${{ env.IMAGE_REPOSITORY }}:$service-${{ env.IMAGE_TAG }} \
              -t ${{ env.IMAGE_REPOSITORY }}:$service-latest \
              .
            docker push ${{ env.IMAGE_REPOSITORY }}:$service-${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_REPOSITORY }}:$service-latest
          done


  durable-events:
    name: Verify durable enforcement recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install enforcement packages
        run: |
          pip install -e agentops-core/ -e agentops-events/
          pip install -e agent-circuit-breaker/"[dev]" -e agent-slo-platform/ -e agent-chaos-toolkit/ -e agent-gateway/ -e dashboard/
      - name: Install NATS server
        run: |
          curl --fail --location --retry 3 https://github.com/nats-io/nats-server/releases/download/v2.10.26/nats-server-v2.10.26-linux-amd64.tar.gz -o /tmp/nats-server.tar.gz
          mkdir -p /tmp/nats-server
          tar -xzf /tmp/nats-server.tar.gz -C /tmp/nats-server --strip-components=1
      - name: Verify persistence, retry and restart recovery
        env:
          NATS_SERVER_BINARY: /tmp/nats-server/nats-server
        run: |
          python examples/durable_breach.py
          python examples/closed_loop.py
