# Production compose — use when Railway/Render not available
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  nats:
    image: nats:2.10-alpine
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data/nats
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: agentops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  slo-platform:
    command: uvicorn agent_slo.api:app --host 0.0.0.0 --port 8000
    build:
      context: .
      args: { SERVICE: agent-slo-platform }
    env_file: .env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always

  circuit-breaker:
    command: uvicorn circuit_breaker.api:app --host 0.0.0.0 --port 8001
    build:
      context: .
      args: { SERVICE: agent-circuit-breaker }
    env_file: .env.production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always

  chaos-toolkit:
    command: uvicorn chaos_toolkit.api:app --host 0.0.0.0 --port 8002
    build:
      context: .
      args: { SERVICE: agent-chaos-toolkit }
    env_file: .env.production
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always

  dashboard:
    command: uvicorn dashboard.api:app --host 0.0.0.0 --port 8003
    build:
      context: .
      args: { SERVICE: dashboard }
    env_file: .env.production
    ports:
      - "8003:8003"
    depends_on: [circuit-breaker, slo-platform, chaos-toolkit]
    restart: always

  gateway:
    command: uvicorn gateway.api:app --host 0.0.0.0 --port 8004
    build:
      context: .
      args: { SERVICE: agent-gateway }
    env_file: .env.production
    ports:
      - "8004:8004"
    environment:
      NATS_URL: nats://nats:4222
      SLO_URL: http://slo-platform:8000
    depends_on: [nats]
    restart: always

volumes:
  natsdata:
  pgdata:
