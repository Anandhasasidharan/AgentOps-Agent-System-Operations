[project]
name = "agentops-platform"

[environments.production]

[environments.production.services.slo-platform]
dockerfilePath = "Dockerfile"
buildArgs = { SERVICE = "agent-slo-platform" }
healthcheckPath = "/health"
envVars = { DATABASE_URL = "${{Postgres.DATABASE_URL}}", PORT = "8000" }

[environments.production.services.circuit-breaker]
dockerfilePath = "Dockerfile"
buildArgs = { SERVICE = "agent-circuit-breaker" }
healthcheckPath = "/health"
envVars = { DATABASE_URL = "${{Postgres.DATABASE_URL}}", PORT = "8001" }

[environments.production.services.chaos-toolkit]
dockerfilePath = "Dockerfile"
buildArgs = { SERVICE = "agent-chaos-toolkit" }
healthcheckPath = "/health"
envVars = { DATABASE_URL = "${{Postgres.DATABASE_URL}}", PORT = "8002" }

[environments.production.services.dashboard]
dockerfilePath = "Dockerfile"
buildArgs = { SERVICE = "dashboard" }
healthcheckPath = "/health"
envVars = { PORT = "8003", CB_URL = "${{circuit-breaker.RAILWAY_PUBLIC_DOMAIN}}", CHAOS_URL = "${{chaos-toolkit.RAILWAY_PUBLIC_DOMAIN}}", SLO_URL = "${{slo-platform.RAILWAY_PUBLIC_DOMAIN}}", GATEWAY_URL = "${{gateway.RAILWAY_PUBLIC_DOMAIN}}" }

[environments.production.services.gateway]
dockerfilePath = "Dockerfile"
buildArgs = { SERVICE = "agent-gateway" }
healthcheckPath = "/health"
envVars = { PORT = "8004" }
